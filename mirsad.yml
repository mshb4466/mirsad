name: mirsad

on:
  schedule:
    - cron: "30 11 * * 1-5"     # قبل الافتتاح: 11:30 UTC = 2:30 ظهراً بتوقيت بغداد (بغداد ثابتة UTC+3)
    - cron: "*/15 * * * 1-5"    # مراقبة: صدور البيانات والحركات المفاجئة
    - cron: "31 12 * * 1-5"     # بعد إصدارات 8:30 نيويورك صيفاً (15:31 بغداد)
    - cron: "31 13 * * 1-5"     # بعد إصدارات 8:30 نيويورك شتاءً (16:31 بغداد)
    - cron: "0 9 * * 6"         # ملخص معايرة أسبوعي: السبت 12:00 ظهراً بتوقيت بغداد
  workflow_dispatch:
    inputs:
      mode:
        description: "test (اختبار فوري) | preopen | auto | calibrate | backtest (اختبار تاريخي 5 سنوات) | actuals-check (فحص الأرقام الفعلية من BLS/FRED/ALFRED)"
        default: "test"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mirsad
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت المتطلبات
        run: pip install -r requirements.txt

      - name: تشغيل مِرصاد
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$SCHEDULE" = "30 11 * * 1-5" ]; then MODE=preopen
            elif [ "$SCHEDULE" = "0 9 * * 6" ]; then MODE=calibrate
            else MODE=auto; fi
          else
            MODE="${INPUT_MODE:-test}"
          fi
          echo "الوضع: $MODE"
          python runner.py --mode "$MODE"

      - name: حفظ الحالة والسجل
        if: always()
        run: |
          git config user.name "mirsad-bot"
          git config user.email "mirsad-bot@users.noreply.github.com"
          for f in state.json history.csv backtest.json; do [ -f "$f" ] && git add "$f"; done
          [ -d backups ] && git add backups     # نسخة ترحيل الحالة تبقى في المستودع (دائمة، تُستعاد بعد انتهاء التشغيل)
          git diff --cached --quiet || (git commit -m "تحديث حالة مِرصاد" && git push)

      - name: تجهيز الواجهة
        id: site
        if: always()
        run: |
          mkdir -p docs
          if [ -f index.html ]; then cp -f index.html docs/index.html; fi
          if [ -d icons ]; then mkdir -p docs/icons && cp -f icons/* docs/icons/; fi
          if [ -f manifest.webmanifest ]; then cp -f manifest.webmanifest docs/manifest.webmanifest; fi
          if [ -f docs/data.json ] && [ -f docs/index.html ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/configure-pages@v5
        if: always() && steps.site.outputs.ready == 'true'
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        if: always() && steps.site.outputs.ready == 'true'
        continue-on-error: true
        with:
          path: docs

      - name: نشر الواجهة
        id: deploy
        if: always() && steps.site.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: التحقق من أن الصفحة المنشورة ليست نسخة قديمة
        if: always() && steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: python verify.py published docs/data.json "$PAGE_URL"
