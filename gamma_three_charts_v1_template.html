<!doctype html><html dir="rtl" lang="ar"><meta charset="utf-8"><meta name="viewport" content="width=390"><style>
:root{--bg:#0b1220;--card:#111a2b;--ln:#22304a;--tx:#e9eef7;--mu:#8f9db5;--ok:#2fe0a0;--crit:#ff5c7a;--spx:#4f9bff;--spy:#ffb02e;--cmb:#b46cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Arabic","Noto Naskh Arabic",sans-serif;padding:12px;width:390px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:10px 10px 6px;margin-bottom:10px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.t{font-size:17px;font-weight:800}.t small{font-size:11.5px;font-weight:500;color:var(--mu)}
.bd{font-size:10.5px;color:var(--mu);border:1px solid var(--ln);border-radius:999px;padding:2px 8px}
svg{width:100%;display:block;direction:ltr}
.tip{background:#0f1828;border:1px solid var(--ln);border-radius:16px;padding:10px 12px;font-size:13px;line-height:1.7}
.tip b.g{color:var(--ok)}.tip b.r{color:var(--crit)}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mu);padding:2px 4px 8px}
.leg i{display:inline-block;width:14px;border-top:2px dashed;vertical-align:middle;margin-left:4px}
</style><body><div id="root"></div>
<script>
const R=__R__;
const spot=R.spot,PW=R.pw,CW=R.cw,FL=R.fl;
const rows=R.rows.map(([k,v])=>({k,v}));
/* SPY (مكافئ SPX): أرقام مثال شكلية على شبكة 10 نقاط، مشتقة من شكل SPX مع اختلاف عند Flip */
const spy=[];for(let k=7570;k<=7810;k+=10){const near=rows.filter(r=>Math.abs(r.k-k)<=5);const a=near.length?near.reduce((s,r)=>s+r.v,0)/near.length:0;let v=a*0.24*(1+0.35*Math.sin(k/19));if(k>=7720&&k<=7740)v=0.35;if(k===7790)v=0.9;spy.push({k,v});}
/* المجموع: كل Strike سباي يُوزَّع على أقرب Strike SPX (شبكة 5 نقاط) */
const comb=rows.map(r=>{let b=spy[0];spy.forEach(x=>{if(Math.abs(x.k-r.k)<Math.abs(b.k-r.k))b=x});const hit=Math.abs(b.k-r.k)<=2.5||(Math.abs(b.k-r.k)===5&&b.k>r.k);return {k:r.k,v:r.v+(hit?b.v:0)}});
const k0=7570,k1=7810,W=380,Lm=38,Rm=8;
const X=k=>Lm+(k-k0)/(k1-k0)*(W-Lm-Rm);
function chart(title,sub,col,data,opt){
 const H=opt.h||200,Tm=34,Bm=26;const mx=Math.max(...data.map(d=>d.v),0)+0.6+(opt.xt||0),mn=Math.min(...data.map(d=>d.v),0)-0.8;
 const Y=v=>Tm+(mx-v)/(mx-mn)*(H-Tm-Bm);const z=Y(0);
 let s=`<svg viewBox="0 0 ${W} ${H}">`;
 const step=opt.step||3;for(let t=Math.ceil(mn/step)*step;t<=mx;t+=step){s+=`<line x1="${Lm}" x2="${W-Rm}" y1="${Y(t)}" y2="${Y(t)}" stroke="#22304a" stroke-dasharray="2 4"/><text x="${Lm-5}" y="${Y(t)+3.5}" text-anchor="end" font-size="10" fill="#8f9db5">${t>0?'+':''}${t}B</text>`}
 for(let k=7600;k<=7800;k+=50){s+=`<line x1="${X(k)}" x2="${X(k)}" y1="${Tm}" y2="${H-Bm}" stroke="#22304a" stroke-opacity=".6"/><text x="${X(k)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#c5d0e4" font-weight="700">${k}</text>`}
 const pts=data.map(d=>[X(d.k),Y(d.v)]);
 const area=(f,c)=>`<path d="M${pts[0][0]},${z} ${pts.map(p=>'L'+p[0].toFixed(1)+','+f(p[1],z).toFixed(1)).join(' ')} L${pts[pts.length-1][0]},${z}Z" fill="${c}" fill-opacity=".38"/>`;
 s+=area(Math.min,'#2fe0a0')+area(Math.max,'#ff5c7a');
 s+=`<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="#f3f7ff" stroke-width="1.6" stroke-linejoin="round"/>`;
 s+=`<line x1="${Lm}" x2="${W-Rm}" y1="${z}" y2="${z}" stroke="#f3f7ff" stroke-width="1.4"/>`;
 [[PW,'Put Wall','#ff5c7a'],[spot,'السعر','#4f9bff'],[CW,'Call Wall','#2fe0a0'],[FL,'Flip','#b46cff']].forEach(([k,l,c])=>{s+=`<line x1="${X(k)}" x2="${X(k)}" y1="${Tm-6}" y2="${H-Bm}" stroke="${c}" stroke-width="1.4" stroke-dasharray="4 3"/><text x="${X(k)}" y="${l==='السعر'?27:14}" text-anchor="middle" font-size="11" font-weight="800" fill="${c}">${l}</text>`});
 (opt.peaks||[]).forEach(k=>{let d=data[0];data.forEach(x=>{if(Math.abs(x.k-k)<Math.abs(d.k-k))d=x});s+=`<circle cx="${X(d.k)}" cy="${Y(d.v)}" r="4.2" fill="${d.v>=0?'#2fe0a0':'#ff5c7a'}" stroke="#0b1220" stroke-width="1.2"/>`});
 (opt.calls||[]).forEach(c=>{let d=data[0];data.forEach(x=>{if(Math.abs(x.k-c.k)<Math.abs(d.k-c.k))d=x});const px=X(d.k),py=Y(d.v),bx=c.bx,by=c.by;
  const cc=c.agree?'#2fe0a0':'#b46cff';
  s+=`<line x1="${bx}" y1="${by+(by<py?15:-15)}" x2="${px}" y2="${py+(by<py?-6:6)}" stroke="${cc}" stroke-width="1.5"/><rect x="${bx-47}" y="${by-15}" width="94" height="30" rx="8" fill="#0b1220" stroke="${cc}" stroke-width="1.5"/><text x="${bx}" y="${by-2}" text-anchor="middle" font-size="10.5" font-weight="800" fill="${cc}">${c.agree?'اتفاق':'اختلاف'}</text><text x="${bx}" y="${by+11}" text-anchor="middle" font-size="9.5" fill="${cc}">${c.agree?'(مستوى أقوى)':'(تأثير أضعف)'}</text>`});
 s+='</svg>';
 return `<div class="card"><div class="hd"><div class="t" style="color:${col}">${title} <small>${sub}</small></div><span class="bd">مليار $ لكل 1%</span></div>${s}</div>`}
document.getElementById('root').innerHTML=
 chart('SPX Net GEX','',"#4f9bff",rows,{peaks:[7600,7650,7700,7725],step:3})+
 chart('SPY Net GEX','(محوَّل إلى مكافئ SPX)',"#ffb02e",spy,{peaks:[7600,7650,7700,7790],step:1})+
 chart('المجموع Net GEX','= SPX + SPY',"#b46cff",comb,{peaks:[7600,7700,7725],step:3,h:270,xt:4.5,calls:[{k:7600,bx:100,by:72,agree:1},{k:7700,bx:222,by:72,agree:1},{k:7725,bx:318,by:196,agree:0}]})+
 `<div class="leg"><span><i style="color:#ff5c7a"></i>Put Wall</span><span><i style="color:#4f9bff"></i>السعر</span><span><i style="color:#2fe0a0"></i>Call Wall</span><span><i style="color:#b46cff"></i>Flip</span><span>نفس الخطوط العمودية في المخططات الثلاثة</span></div>
 <div class="tip">المخطط الثالث يجمع <b style="color:#4f9bff">SPX</b> و<b style="color:#ffb02e">SPY</b> بعد التحويل إلى مقياس SPX. إذا اتفقت القمم <b class="g">يتقوّى المستوى</b>، وإذا اختلفت <b class="r">يضعف التأثير</b>. تقدير لا توقّع، والجمع تقريبي (Strike السباي يُوزَّع على أقرب Strike).</div>`;
</script></body></html>
